<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPlanner</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo">
            <span class="nav-logo-text">UniPlanner</span>
        </div>
        <div class="nav-date" id="navDate"></div>
    </nav>

    <main class="app">

        <header class="app-header">
            <h1 class="app-title">Minhas Tarefas</h1>
            <p class="app-subtitle">Gerencie suas atividades acadêmicas</p>
        </header>

        <!-- Mensagem de boas vindas -->
        <div class="welcome-banner" id="welcomeBanner">
            <div class="welcome-content">
                <span class="welcome-icon">👋</span>
                <div class="welcome-text">
                    <strong>Bem-vindo ao UniPlanner!</strong>
                    <p>Comece criando sua primeira disciplina clicando em "+ Nova Disciplina".</p>
                </div>
                <button class="welcome-close" onclick="closeWelcome()">✕</button>
            </div>
        </div>

        <section id="subjectsSection">
            <h2 class="section-label">Disciplinas</h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
        </section>

        <section id="completedSection">
            <h2 class="section-label">Tarefas Concluídas</h2>
            <div class="completed-grid" id="completedGrid"></div>
        </section>

    </main>

    <!-- Toast de feedback -->
    <div class="toast" id="toast"></div>

    <div class="overlay" id="overlay"></div>

    <!-- Modal: Nova Disciplina -->
    <div class="modal" id="modalSubject">
        <h2 class="modal-title">Nova Disciplina</h2>
        <div class="form-group">
            <label class="form-label">Nome</label>
            <input type="text" class="form-input" id="subjectName" placeholder="Ex: Programação Web">
        </div>
        <div class="form-group">
            <label class="form-label">Cor</label>
            <div class="color-picker" id="colorPicker"></div>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveSubject()">Criar</button>
        </div>
    </div>

    <!-- Modal: Nova Tarefa -->
    <div class="modal" id="modalTask">
        <h2 class="modal-title">Nova Tarefa</h2>
        <div class="form-group">
            <label class="form-label">Título</label>
            <input type="text" class="form-input" id="taskTitle" placeholder="Ex: Prova N1">
        </div>
        <div class="form-group">
            <label class="form-label">Descrição</label>
            <textarea class="form-textarea" id="taskDesc" placeholder="Breve descrição..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Prazo</label>
            <input type="date" class="form-input" id="taskDeadline">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveTask()">Criar</button>
        </div>
    </div>

    <!-- Modal: Editar Tarefa -->
    <div class="modal" id="modalEditTask">
        <h2 class="modal-title">Editar Tarefa</h2>
        <div class="form-group">
            <label class="form-label">Título</label>
            <input type="text" class="form-input" id="editTaskTitle" placeholder="Ex: Prova N1">
        </div>
        <div class="form-group">
            <label class="form-label">Descrição</label>
            <textarea class="form-textarea" id="editTaskDesc" placeholder="Breve descrição..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Prazo</label>
            <input type="date" class="form-input" id="editTaskDeadline">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveEditTask()">Salvar</button>
        </div>
    </div>

    <script src="js/model.js"></script>
    <script src="js/scripts.js"></script>
</body>

</html>
